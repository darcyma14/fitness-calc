<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEIVA 단위 변환 & 계산기</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#17212f;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:20px 12px}.app{max-width:540px;margin:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 10px 36px #1b355015}h1{font-size:1.5rem;margin:0 0 6px}.sub{color:#64748b;margin:0 0 24px}h2{font-size:1.08rem;margin:0 0 12px}.section{border-top:1px solid #e2e8f0;padding-top:20px;margin-top:20px}.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:7px}.field input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:1.1rem;min-width:0}.hint{font-size:.8rem;color:#64748b;margin:10px 0 0}.calc{background:#f2f6fd;padding:15px;border-radius:16px}.display{width:100%;border:0;background:white;border-radius:10px;padding:16px;text-align:right;font-size:2rem;font-variant-numeric:tabular-nums;color:#17212f;margin-bottom:12px;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.keys button{font-size:1.25rem;font-weight:700;padding:17px 4px;border:0;border-radius:12px;background:white;color:#17212f;cursor:pointer;touch-action:manipulation}.keys button.op{background:#dbeafe;color:#1459bc}.keys button.equal{background:#1459bc;color:white}.keys button.clear{background:#fee2e2;color:#b91c1c}.keys button:active{filter:brightness(.93)}.send{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.send button{border:0;border-radius:10px;background:#e0edff;color:#1459bc;font-weight:700;padding:13px 7px;cursor:pointer}.send button:active{filter:brightness(.95)}.send-status{min-height:1.3em;margin-top:9px;color:#176a46;font-size:.85rem}.foot{font-size:.8rem;color:#64748b;line-height:1.6;margin-top:18px}@media(max-width:420px){.app{padding:19px 15px}.keys button{padding:15px 3px}}
</style>
</head>
<body>
<main class="app">
<h1>🧮 HEIVA 계산기</h1>
<p class="sub">트레이닝 단위 변환과 사칙연산 · 계산 결과를 무게 또는 길이로 전송</p>
<section>
<h2>⚖️ 무게 변환</h2>
<div class="unit-grid"><div class="field"><label for="lb">파운드 (lb)</label><input id="lb" type="number" step="any" inputmode="decimal" placeholder="lb"></div><div class="field"><label for="kg">킬로그램 (kg)</label><input id="kg" type="number" step="any" inputmode="decimal" placeholder="kg"></div></div>
</section>
<section class="section">
<h2>📏 길이 변환</h2>
<div class="unit-grid"><div class="field"><label for="inch">인치 (inch)</label><input id="inch" type="number" step="any" inputmode="decimal" placeholder="inch"></div><div class="field"><label for="cm">센티미터 (cm)</label><input id="cm" type="number" step="any" inputmode="decimal" placeholder="cm"></div></div>
<p class="hint">어느 쪽에 입력해도 반대쪽 값이 자동으로 계산됩니다.</p>
</section>
<section class="section">
<h2>🔢 일반 계산기</h2>
<div class="calc">
<input class="display" id="display" type="text" value="0" readonly aria-label="계산 결과">
<div class="keys" id="keys">
<button class="clear" data-key="C">C</button><button data-key="back">⌫</button><button data-key="sign">±</button><button class="op" data-key="/">÷</button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="op" data-key="*">×</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="op" data-key="-">−</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="op" data-key="+">+</button>
<button data-key="0">0</button><button data-key=".">.</button><button class="equal" data-key="=" style="grid-column:span 2">=</button>
</div><div class="send"><button type="button" data-send="lb">↑ 결과를 lb로 보내기</button><button type="button" data-send="kg">↑ 결과를 kg로 보내기</button><button type="button" data-send="inch">↑ 결과를 inch로 보내기</button><button type="button" data-send="cm">↑ 결과를 cm로 보내기</button></div><p id="send-status" class="send-status" role="status"></p></div>
<p class="hint">계산 결과는 소수점 둘째 자리까지 표시합니다. (예: 3.33, 2.50)</p>
</section>
<p class="foot">1 lb = 0.45359237 kg · 1 inch = 2.54 cm. 모든 계산은 브라우저에서 실행됩니다.</p>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const format = n => Number.isFinite(n) ? n.toFixed(2) : '';
  function linkUnits(a, b, multiplier) {
    $(a).addEventListener('input', () => { $(b).value = $(a).value === '' ? '' : format(Number($(a).value) * multiplier); });
    $(b).addEventListener('input', () => { $(a).value = $(b).value === '' ? '' : format(Number($(b).value) / multiplier); });
  }
  linkUnits('lb', 'kg', 0.45359237);
  linkUnits('inch', 'cm', 2.54);

  let entry = '0';
  let accumulator = null;
  let operator = null;
  let startNew = false;
  let error = false;
  const display = $('display');
  const show = () => { display.value = entry; };
  function calculate(a, b, op) {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    if (op === '*') return a * b;
    if (op === '/') return b === 0 ? NaN : a / b;
    return b;
  }
  function press(key) {
    if (key === 'C') { entry='0'; accumulator=null; operator=null; startNew=false; error=false; return show(); }
    if (error) return;
    if (/^[0-9]$/.test(key)) {
      if (startNew) { entry=key; startNew=false; }
      else entry=entry==='0' ? key : entry+key;
    } else if (key === '.') {
      if (startNew) { entry='0.'; startNew=false; }
      else if (!entry.includes('.')) entry+='.';
    } else if (key === 'back') {
      if (startNew) { entry='0'; startNew=false; }
      else entry=entry.length<=1 || (entry.length===2 && entry[0]==='-') ? '0' : entry.slice(0,-1);
    } else if (key === 'sign') {
      if (Number(entry)!==0) entry=entry.startsWith('-') ? entry.slice(1) : '-'+entry;
    } else if (['+','-','*','/'].includes(key)) {
      if (operator !== null && !startNew) {
        const n=calculate(accumulator,Number(entry),operator);
        if (!Number.isFinite(n)) {entry='오류';error=true;return show();}
        accumulator=n; entry=format(n);
      } else if (accumulator === null) accumulator=Number(entry);
      operator=key;startNew=true;
    } else if (key === '=') {
      if (operator !== null && !startNew) {
        const n=calculate(accumulator,Number(entry),operator);
        if (!Number.isFinite(n)) {entry='오류';error=true;return show();}
        entry=format(n); accumulator=null;operator=null;startNew=true;
      }
    }
    show();
  }
  document.querySelectorAll('[data-send]').forEach(button => {
    button.addEventListener('click', () => {
      const value = Number(entry);
      const status = $('send-status');
      if (error || !Number.isFinite(value)) {
        status.textContent = '먼저 올바른 계산 결과를 만들어 주세요.';
        return;
      }
      const unit = button.dataset.send;
      const weight = unit === 'lb' || unit === 'kg';
      const other = weight ? (unit === 'lb' ? 'kg' : 'lb') : (unit === 'inch' ? 'cm' : 'inch');
      const factor = weight ? 0.45359237 : 2.54;
      const forward = unit === 'lb' || unit === 'inch';
      $(unit).value = format(value);
      $(other).value = format(forward ? value * factor : value / factor);
      status.textContent = `${format(value)} ${unit} 값을 ${weight ? '무게' : '길이'} 변환에 적용했어요.`;
      $(unit).scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
  $('keys').addEventListener('click', e => { const btn=e.target.closest('button[data-key]');if(btn)press(btn.dataset.key); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName==='INPUT' && e.target!==display) return;
    let key=e.key;
    if (key==='Enter') key='=';
    if (key==='Escape') key='C';
    if (key==='Backspace') key='back';
    if (/^[0-9.]$/.test(key)||['+','-','*','/','=','C','back'].includes(key)) {e.preventDefault();press(key);}
  });
})();
</script>
</body>
</html>
